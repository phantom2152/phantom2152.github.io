<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>phantom</title>
  <meta name="description" content="Phantom — Python, Telegram bots, and small tools.">
  <link rel="icon" href="https://github.com/phantom2152.png">
  <style>
    :root {
      --bg: #05060a;
      --fg: #d7dae0;
      --muted: #7b8190;
      --line: #171a23;
      --accent: #e5604d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.6 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 72px 20px;
    }
    main { width: 100%; max-width: 560px; }
    header { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
    header img {
      width: 56px; height: 56px; border-radius: 50%;
      border: 1px solid var(--line);
    }
    h1 { font-size: 1.15rem; margin: 0; font-weight: 600; }
    .handle { color: var(--muted); font-size: .85rem; }
    p { color: var(--muted); margin: 0 0 36px; }
    h2 {
      font-size: .75rem; letter-spacing: .12em; text-transform: uppercase;
      color: var(--muted); font-weight: 500; margin: 0 0 12px;
    }
    ul { list-style: none; padding: 0; margin: 0 0 40px; }
    li { border-top: 1px solid var(--line); }
    li:last-child { border-bottom: 1px solid var(--line); }
    li a {
      display: block; padding: 14px 4px;
      color: var(--fg); text-decoration: none;
      transition: color .15s, padding-left .15s;
    }
    li a:hover { color: var(--accent); padding-left: 10px; }
    li span { display: block; color: var(--muted); font-size: .8rem; }
    .links { display: flex; gap: 20px; font-size: .9rem; }
    .links a { color: var(--muted); text-decoration: none; border-bottom: 1px solid transparent; }
    .links a:hover { color: var(--accent); border-color: var(--accent); }
    footer { margin-top: 56px; color: #3a3f4d; font-size: .75rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="https://l6ui2gvc57.ufs.sh/f/AdEvobD5aluHUcFMBfvMaNnH90Tk5CyPt4FOZSm6KEs2QbDw" alt="Phantom avatar">
      <div>
        <h1>Phantom</h1>
        <div class="handle">@phantom2152</div>
      </div>
    </header>

    <p>I do stuff.</p>

    <div class="links">
      <a href="https://github.com/phantom2152" target="_blank" rel="noopener">github</a>
      <a href="https://github.com/phantom2152?tab=repositories" target="_blank" rel="noopener">all repos</a>
    </div>

    <footer>&copy; phantom2152</footer>
  </main>
</body>
</html>
